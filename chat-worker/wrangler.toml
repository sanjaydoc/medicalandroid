name = "medicalandroid-chat"
main = "worker.js"
compatibility_date = "2024-11-01"

# Site origins allowed to call this proxy (comma-separated, no trailing slash).
# The Capacitor Android/iOS app runs from a local WebView origin (https://localhost,
# capacitor://localhost, http://localhost) — those must be allowed so the packaged
# app's Online mode can reach the Worker (otherwise it 403s "Origin not allowed").
[vars]
ALLOWED_ORIGINS = "https://medicalandroid.com,https://www.medicalandroid.com,http://localhost:5173,https://localhost,http://localhost,capacitor://localhost"
# Optional: override the model. Defaults to a current Sonnet inside worker.js.
# MODEL = "claude-sonnet-4-5-20250929"

# Per-IP rate limiting (20 req/min). OPTIONAL — worker.js safely skips throttling
# when this binding is absent. To enable it under git auto-deploy, create a KV
# namespace for THIS worker in the Cloudflare dashboard (Workers & Pages → KV),
# then uncomment the block below and paste that namespace's id (NOT the StemCells
# one). Left commented so a git deploy never binds the wrong project's KV.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_MEDICALANDROID_KV_NAMESPACE_ID"

# The API key is NOT stored here — it lives as an encrypted secret on the Worker
# (Settings → Variables and Secrets → ANTHROPIC_API_KEY) and is preserved across
# every deploy, including git-triggered ones. NEVER commit secrets here.
