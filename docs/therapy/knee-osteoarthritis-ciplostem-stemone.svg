<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="StemOne / CiploStem — allogeneic pooled bone-marrow MSC for knee osteoarthritis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#e9f0fb"/>
    </linearGradient>
    <linearGradient id="vial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b90f6"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <radialGradient id="cellg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eaf1fe"/>
      <stop offset="1" stop-color="#83a9f8"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#153a7c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- eyebrow -->
  <text x="90" y="120" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#2f6fe0">ORTHOPEDICS · KNEE OSTEOARTHRITIS</text>

  <!-- title -->
  <text x="88" y="196" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-1" fill="#141a27">StemOne<tspan font-size="40" baseline-shift="super">®</tspan>  ·  CiploStem<tspan font-size="40" baseline-shift="super">®</tspan></text>
  <text x="90" y="250" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="34" font-weight="600" fill="#4a5670">Allogeneic pooled bone-marrow MSC (Stempeucel® platform)</text>

  <!-- vial glyph -->
  <g filter="url(#soft)" transform="translate(150,360)">
    <rect x="-6" y="-40" width="150" height="34" rx="10" fill="#c9d8f5"/>
    <rect x="14" y="-58" width="110" height="26" rx="8" fill="#2f6fe0"/>
    <path d="M6 -6 h126 v300 a30 30 0 0 1 -30 30 h-66 a30 30 0 0 1 -30 -30 z" fill="#ffffff" stroke="#d3ddf0" stroke-width="3"/>
    <path d="M6 150 h126 v138 a30 30 0 0 1 -30 30 h-66 a30 30 0 0 1 -30 -30 z" fill="url(#vial)" opacity="0.92"/>
    <!-- floating cells -->
    <circle cx="45" cy="210" r="15" fill="url(#cellg)"/>
    <circle cx="92" cy="250" r="12" fill="url(#cellg)"/>
    <circle cx="60" cy="278" r="10" fill="url(#cellg)"/>
    <circle cx="100" cy="196" r="9" fill="url(#cellg)"/>
    <text x="69" y="130" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="800" fill="#2f6fe0">25M</text>
    <text x="69" y="160" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#4a5670">MSCs</text>
  </g>

  <!-- knee joint glyph -->
  <g transform="translate(430,360)" fill="none" stroke="#2f6fe0" stroke-width="14" stroke-linecap="round">
    <path d="M40 0 C 40 90, 120 120, 110 210" stroke="#83a9f8"/>
    <path d="M200 6 C 200 100, 120 120, 130 210" stroke="#4285f4"/>
    <circle cx="120" cy="150" r="34" fill="#eaf1fe" stroke="#2f6fe0" stroke-width="10"/>
  </g>

  <!-- fact chips -->
  <g font-family="'Segoe UI',Roboto,Arial,sans-serif">
    <g filter="url(#soft)">
      <rect x="700" y="360" width="410" height="92" rx="18" fill="#ffffff"/>
      <rect x="760" y="580" width="350" height="92" rx="18" fill="#ffffff"/>
      <rect x="700" y="470" width="410" height="92" rx="18" fill="#ffffff"/>
      <rect x="760" y="690" width="350" height="92" rx="18" fill="#ffffff"/>
    </g>
    <text x="726" y="405" font-size="26" font-weight="800" fill="#141a27">Intra-articular</text>
    <text x="726" y="436" font-size="19" fill="#4a5670">single injection + 2 ml hyaluronate</text>

    <text x="726" y="515" font-size="26" font-weight="800" fill="#141a27">KL Grade II–III</text>
    <text x="726" y="546" font-size="19" fill="#4a5670">non-obese (BMI &lt; 30 kg/m²)</text>

    <text x="786" y="625" font-size="26" font-weight="800" fill="#15803d">DCGI / CDSCO approved</text>
    <text x="786" y="656" font-size="19" fill="#4a5670">Permission MF-01/2022</text>

    <text x="786" y="735" font-size="26" font-weight="800" fill="#141a27">Phase 3 · 2-year data</text>
    <text x="786" y="766" font-size="19" fill="#4a5670">WOMAC &amp; VAS ↓ (p&lt;0.0001)</text>
  </g>

  <!-- footer -->
  <text x="90" y="828" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="20" fill="#8592ac">Stempeucel® · Mfd. Stempeutics Research · marketed by Cipla (CiploStem) / Alkem (StemOne) · India</text>
</svg>
